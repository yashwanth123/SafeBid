name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safebid
          POSTGRES_PASSWORD: safebid
          POSTGRES_DB: safebid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safebid -d safebid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://safebid:safebid@localhost:5432/safebid_test?schema=public
      - run: npm test
        env:
          DATABASE_URL: postgresql://safebid:safebid@localhost:5432/safebid_test?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-change-me-32chars
          JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32ch
          MOCK_PAYMENTS: "true"
          MOCK_IDENTITY: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_MOCK_PAYMENTS: "true"
