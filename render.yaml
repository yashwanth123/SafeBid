services:
  - type: web
    name: safebid-api
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safebid-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PLATFORM_COMMISSION_BPS
        value: "500"
      - key: MOCK_PAYMENTS
        value: "true"
      - key: MOCK_IDENTITY
        value: "true"
      - key: INVITE_CODE
        sync: false

databases:
  - name: safebid-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
